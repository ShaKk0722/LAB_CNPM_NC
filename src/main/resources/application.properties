spring.application.name=student-management

# ==========================
# PostgreSQL Datasource
# ==========================
# Chính thức: đọc từ biến môi trường (được cấu hình trong .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/student_management}
# Leave empty when URL contains user/password (e.g. Neon)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SQL init: use "embedded" so data.sql runs only with H2/HSQL (not Neon/Postgres) to avoid duplicate key
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true
