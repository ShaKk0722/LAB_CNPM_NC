spring.application.name=student-management

# ==========================
# PostgreSQL Datasource
# ==========================
# Chính thức: đọc từ biến môi trường (được cấu hình trong .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/student_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SQL init (ví dụ data.sql) sau khi schema đã sẵn sàng
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
