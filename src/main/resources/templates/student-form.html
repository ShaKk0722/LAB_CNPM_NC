<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${mode == 'edit'} ? 'Chỉnh Sửa Sinh Viên' : 'Thêm Mới Sinh Viên'">
    Thêm Mới Sinh Viên
  </title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    form { max-width: 400px; }
    .field { margin-bottom: 12px; display: flex; flex-direction: column; }
    label { font-weight: 600; margin-bottom: 4px; }
    input[type="text"], input[type="number"], input[type="email"] {
      padding: 8px; border: 1px solid #ccc; border-radius: 4px;
    }
    button { padding: 8px 12px; cursor: pointer; margin-right: 8px; }
  </style>
</head>
<body>
  <a href="/students">&larr; Quay về Danh Sách</a>

  <h1 th:text="${mode == 'edit'} ? 'Chỉnh Sửa Sinh Viên' : 'Thêm Mới Sinh Viên'">
    Thêm Mới Sinh Viên
  </h1>

  <form th:action="${mode == 'edit'} ? @{'/students/' + ${student.id}} : @{/students}" method="post">
    <div class="field" th:if="${mode == 'edit'}">
      <label>ID</label>
      <input type="text" th:value="${student.id}" disabled />
    </div>

    <div class="field">
      <label for="name">Họ và Tên</label>
      <input id="name" name="name" type="text" required th:value="${student.name}" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required th:value="${student.email}" />
    </div>

    <div class="field">
      <label for="age">Tuổi</label>
      <input id="age" name="age" type="number" min="0" required th:value="${student.age}" />
    </div>

    <button type="submit" th:text="${mode == 'edit'} ? 'Lưu Thay Đổi' : 'Lưu'">Lưu</button>
    <a href="/students"><button type="button">Hủy</button></a>
  </form>
</body>
</html>
