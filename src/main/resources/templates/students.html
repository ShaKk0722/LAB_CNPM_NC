<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Danh Sách Sinh Viên</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .text-danger { color: #b00020; font-weight: 600; }
    .toolbar { display: flex; gap: 8px; align-items: center; }
    input[type="text"] { padding: 8px; min-width: 240px; }
    button { padding: 8px 12px; cursor: pointer; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Danh Sách Sinh Viên (SSR)</h1>

  <form class="toolbar" action="/students" method="GET">
    <input type="text" name="keyword" placeholder="Nhập tên..." th:value="${keyword}" />
    <button type="submit">Tìm</button>
    <a class="muted" href="/students">Reset</a>
  </form>

  <p class="muted" th:if="${dsSinhVien != null}">
    Tổng: <span th:text="${dsSinhVien.size()}">0</span> sinh viên
  </p>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Họ và Tên</th>
        <th>Email</th>
        <th>Tuổi</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="student : ${dsSinhVien}" th:classappend="${student.age < 18} ? 'text-danger' : ''">
        <td th:text="${student.id}">ID Mẫu</td>
        <td th:text="${student.name}">Tên Mẫu</td>
        <td th:text="${student.email}">Email Mẫu</td>
        <td th:text="${student.age}">0</td>
      </tr>
      <tr th:if="${dsSinhVien == null || dsSinhVien.isEmpty()}">
        <td colspan="4" class="muted">Không có dữ liệu.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
